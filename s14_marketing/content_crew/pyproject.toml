[project]
name = "content_crew"
version = "0.1.0"
description = "content_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.35,<2.0.0"
]

[project.scripts]
content_crew = "content_crew.main:run"
run_crew = "content_crew.main:run"
train = "content_crew.main:train"
replay = "content_crew.main:replay"
test = "content_crew.main:test"
run_with_trigger = "content_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "95099060-0a0e-4494-a177-c1a05a017683"
